# Cluster version of phase5_eps.yaml for the publishable Phase 5 numbers: identical
# variants, but 10 attack trials per cell instead of 3 (tighter bootstrap CIs).
# Every silo, both label modes and chance baselines are on by default.
# One variant per job:  fedastro grid configs/sweeps/phase5_eps_cluster.yaml --index i
name: p5epsc
base: ../experiments/wesad_privacy.yaml
seeds: [0, 1, 2, 3, 4]
include_base: true
common:
  privacy.attack.trials: 10
fixed:
  privacy.enabled: true
axes:
  privacy.target_epsilon: [0.5, 1.0, 2.0, 3.0, 5.0, 10.0, 13.0]
