# Smoke test for SIMULATED secure aggregation (Phase H4) on the cinc15 topology, SYNTHETIC
# data, simulated links on (loss of signal off so the run is easy to read). Pairwise masks at
# the regional and global levels. Scripted dropouts after masking:
# - leo_nasa in round 3: LEO's 4 survivors are below min_participants (5), so LEO falls back
#   (nothing is unmasked);
# - moon in round 4 (a merge round): the global group (3) keeps 2 survivors >= 2, so the
#   survivors run the recovery step and the merge goes ahead without Moon.
# The masks come from a seeded PRG: a protocol simulation, not cryptographically secure.
name: smoke_hier_secagg
seed: 0
seeds: [0, 1]
hierarchy: cinc15
shift:
  enabled: true
  kind: both
  magnitude: 1.0
data:
  name: synthetic
  synthetic:
    n_subjects: 240
    windows_per_subject: 10
    n_groups: 8
    group_names: [g12ec, ptbxl, ptb, incart, ningbo, chapman, cpsc, cpsc_extra]
partition:
  holdout_subjects: 0
arms: [local_only, hierarchical]
train:
  epochs: 3
fl:
  rounds: 6
comms:
  enabled: true
  los: false
  jitter_s: 0.0
hier_fl:
  global_every: 2
  region_deadline_s: 120.0
secagg:
  enabled: true
  dropout:
    leo_nasa: [3]
    moon: [4]
notes: "Simulated secure aggregation smoke test (cinc15)."
