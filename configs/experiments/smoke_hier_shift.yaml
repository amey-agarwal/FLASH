# Smoke test for the SIMULATED location shift (Phase H2) on the cinc15 topology, SYNTHETIC
# data. LEO is the unshifted reference; Moon and Mars shift in different seeded directions.
# Inspect only until Phase H3:  fedastro inspect configs/experiments/smoke_hier_shift.yaml
name: smoke_hier_shift
seed: 0
seeds: [0, 1]
hierarchy: cinc15
shift:
  enabled: true
  kind: both                   # covariate (offset + scale) and concept (class-conditional offset)
  magnitude: 1.0               # in training-std units; 0 is the control
data:
  name: synthetic
  synthetic:
    n_subjects: 240
    windows_per_subject: 10
    n_groups: 8
    group_names: [g12ec, ptbxl, ptb, incart, ningbo, chapman, cpsc, cpsc_extra]
partition:
  holdout_subjects: 0
train:
  epochs: 3
fl:
  rounds: 3
notes: "Simulated location-shift smoke test (cinc15)."
